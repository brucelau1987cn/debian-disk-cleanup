name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck python3-pytest
      - name: Bash syntax check
        run: bash -n debian-disk-cleanup.sh
      - name: ShellCheck
        run: shellcheck debian-disk-cleanup.sh
      - name: Static tests
        run: pytest -q
